          )

          replace_once(
              "thread.cpp",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR wait_return idx=%zu searching=%d exit=%d\\n\", idx, int(searching), int(exit));",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR wait_return this=%p idx=%zu searching=%d exit=%d\\n\", static_cast<void*>(this), idx, int(searching), int(exit));"
          )

          replace_once(
              "thread.cpp",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR notify_one idx=%zu\\n\", idx);",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR notify_one this=%p idx=%zu\\n\", static_cast<void*>(this), idx);"
          )

          replace_once(
              "thread.cpp",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR idle_job_begin idx=%zu\\n\", idx);",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR idle_job_begin this=%p idx=%zu\\n\", static_cast<void*>(this), idx);"
          )

          replace_once(
              "thread.cpp",
              "    sync_cout << \"WASM_DIAG start_searching_request idx=\" << idx << sync_endl;",
              "    std::fprintf(stderr, \"WASM_DIAG_STDERR start_searching_request this=%p idx=%zu\\n\", static_cast<void*>(this), idx);\n    std::fflush(stderr);\n    sync_cout << \"WASM_DIAG start_searching_request idx=\" << idx << sync_endl;"
          )
          replace_once(
              "thread.cpp",
              "void Thread::start_searching() {\n    assert(worker != nullptr);\n#if defined(__EMSCRIPTEN__)\n    std::fprintf(stderr, \"WASM_DIAG_STDERR start_searching_request this=%p idx=%zu\\n\", static_cast<void*>(this), idx);\n    std::fflush(stderr);\n    sync_cout << \"WASM_DIAG start_searching_request idx=\" << idx << sync_endl;\n#endif\n    run_custom_job([this]() { worker->start_searching(); });\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG start_searching_queued idx=\" << idx << sync_endl;\n#endif\n}",
              "void Thread::start_searching() {\n    assert(worker != nullptr);\n#if defined(__EMSCRIPTEN__)\n    std::fprintf(stderr, \"WASM_DIAG_STDERR start_searching_request this=%p idx=%zu exit=%d\\n\", static_cast<void*>(this), idx, int(exit));\n    std::fflush(stderr);\n    sync_cout << \"WASM_DIAG start_searching_request idx=\" << idx << sync_endl;\n    if (idx == 0 && !exit) {\n        sync_cout << \"WASM_DIAG direct_main_search_enter\" << sync_endl;\n        worker->start_searching();\n        sync_cout << \"WASM_DIAG direct_main_search_return\" << sync_endl;\n        return;\n    }\n#endif\n    run_custom_job([this]() { worker->start_searching(); });\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG start_searching_queued idx=\" << idx << sync_endl;\n#endif\n}"
          )
