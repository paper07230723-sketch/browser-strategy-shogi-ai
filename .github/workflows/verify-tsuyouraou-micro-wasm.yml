                      static_cast<void*>(this), idx, int(exit), int(bool(jobFunc))
                  );
                  std::fflush(stderr);
          #endif"""
          )

          replace_once(
              "        while (!searching) {",
              "        unsigned int diagPollCount = 0;" + chr(10) + "        while (!searching) {"
          )

          replace_once(
              "const auto status = cv.wait_for(lk, std::chrono::milliseconds(100));",
