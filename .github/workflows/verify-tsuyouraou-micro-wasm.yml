name: Verify TuyouraOu 11 micro WASM

on:
  push:
    branches:
      - automation/tsuyouraou-micro-wasm-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuyouraou-micro-wasm
  cancel-in-progress: true

jobs:      
  build-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout pinned YaneuraOu source
        uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 32165a8ded29e5fd1bcbd2fa5dbf2eeb6725bd0f
          path: upstream

      - name: Install archive utility
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.23

      - name: Verify toolchain
        run: |
          emcc --version
          em++ --version
          node --version
          python3 --version

      - name: Download and verify micro evaluation
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/tuyouraou-micro.7z"
          extract_dir="$RUNNER_TEMP/micro-eval"

          curl --fail --location --retry 3 \
            "https://github.com/paper07230723-sketch/browser-strategy-shogi-ai/releases/download/eval-check-2026-10-22/TuyouraOu11micro-SFNN_ka2_2048_8_64_progress8-epoch0010-20261001.2.7z" \
            --output "$archive"

          echo "d1326e9a620c30d40ae553259dd0b6828d2f4e9fca3b6ab9440566579ab0e8c2  $archive" \
            | sha256sum --check -

          mkdir -p "$extract_dir"
          7z x "$archive" "-o$extract_dir" -y

          nn_path="$(find "$extract_dir" -type f -name nn.bin -print -quit)"
          test -n "$nn_path"

          eval_dir="$(dirname "$nn_path")"
          for file in nn.bin progress.bin eval_options.txt tag.json; do
            test -f "$eval_dir/$file"
          done

          mkdir -p "$GITHUB_WORKSPACE/output/evaldata"
          cp "$eval_dir"/nn.bin \
             "$eval_dir"/progress.bin \
             "$eval_dir"/eval_options.txt \
             "$eval_dir"/tag.json \
             "$GITHUB_WORKSPACE/output/evaldata/"
             
      - name: Add temporary WASM search diagnostics
        working-directory: upstream/source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(filename, old, new):
              path = Path(filename)
              source = path.read_text(encoding="utf-8-sig")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"ERROR: {filename}: expected 1 match, got {count}"
                  )
              path.write_text(
                  source.replace(old, new, 1),
                  encoding="utf-8"
              )

          replace_once(
              "thread.cpp",
              "Search::LimitsType limits) {\n\n    main_thread()->wait_for_search_finished();",
              "Search::LimitsType limits) {\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG start_thinking_enter\" << sync_endl;\n#endif\n\n    main_thread()->wait_for_search_finished();"
          )

          replace_once(
              "thread.cpp",
              "    for (auto&& th : threads)\n        th->wait_for_search_finished();\n\n    main_thread()->start_searching();",
              "    for (auto&& th : threads)\n        th->wait_for_search_finished();\n\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG setup_jobs_finished\" << sync_endl;\n    sync_cout << \"WASM_DIAG scheduling_main_search\" << sync_endl;\n#endif\n    main_thread()->start_searching();\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG main_search_scheduled\" << sync_endl;\n#endif"
          )

          replace_once(
              "thread.cpp",
              "        if (job)\n            job();",
              "        if (job) {\n#if defined(__EMSCRIPTEN__)\n            sync_cout << \"WASM_DIAG idle_job_begin idx=\" << idx << sync_endl;\n#endif\n            job();\n#if defined(__EMSCRIPTEN__)\n            sync_cout << \"WASM_DIAG idle_job_end idx=\" << idx << sync_endl;\n#endif\n        }"
          )

          search_file = "engine/yaneuraou-engine/yaneuraou-search.cpp"

          replace_once(
              search_file,
              "void Search::YaneuraOuWorker::start_searching() {\n\n#if defined(USE_SFNN)",
              "void Search::YaneuraOuWorker::start_searching() {\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG worker_start_searching\" << sync_endl;\n#endif\n\n#if defined(USE_SFNN)"
          )

          replace_once(
              search_file,
              "    uciPvSent = iterative_deepening();  // main thread start searching",
              "#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG iterative_deepening_enter\" << sync_endl;\n#endif\n    uciPvSent = iterative_deepening();  // main thread start searching\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG iterative_deepening_return\" << sync_endl;\n#endif"
          )
          replace_once(
              "thread.cpp",
              "void Thread::start_searching() {\n    assert(worker != nullptr);\n    run_custom_job([this]() { worker->start_searching(); });\n}",
              "void Thread::start_searching() {\n    assert(worker != nullptr);\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG start_searching_request idx=\" << idx << sync_endl;\n#endif\n    run_custom_job([this]() { worker->start_searching(); });\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG start_searching_queued idx=\" << idx << sync_endl;\n#endif\n}"
          )

          replace_once(
              "thread.cpp",
              "        cv.wait(lk, [&] { return searching; });\n\n        if (exit)\n            return;",
              "#if defined(__EMSCRIPTEN__)\n        sync_cout << \"WASM_DIAG idle_wait_begin idx=\" << idx << sync_endl;\n#endif\n        cv.wait(lk, [&] { return searching; });\n#if defined(__EMSCRIPTEN__)\n        sync_cout << \"WASM_DIAG idle_wait_return idx=\" << idx << \" searching=\" << searching << \" exit=\" << exit << sync_endl;\n#endif\n\n        if (exit)\n            return;"
          )
          replace_once(
              "thread.cpp",
              "void Thread::run_custom_job(std::function<void()> f) {\n    {\n        std::unique_lock<std::mutex> lk(mutex);\n        cv.wait(lk, [&] { return !searching; });\n        jobFunc   = std::move(f);\n        searching = true;\n    }\n    cv.notify_one();\n}",
              "void Thread::run_custom_job(std::function<void()> f) {\n    {\n        std::unique_lock<std::mutex> lk(mutex);\n        cv.wait(lk, [&] { return !searching; });\n        jobFunc   = std::move(f);\n        searching = true;\n    }\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG notify_before idx=\" << idx << sync_endl;\n#endif\n    cv.notify_one();\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG notify_after idx=\" << idx << sync_endl;\n#endif\n}"
          )
          replace_once(
              "thread.cpp",
              "#include <cmath>     // std::abs",
              "#include <cmath>     // std::abs\n#include <cstdio>"
          )

          replace_once(
              search_file,
              "#include <sstream>",
              "#include <cstdio>\n#include <sstream>"
          )

          replace_once(
              "thread.cpp",
              "        cv.wait(lk, [&] { return searching; });\n#if defined(__EMSCRIPTEN__)\n        sync_cout << \"WASM_DIAG idle_wait_return idx=\" << idx << \" searching=\" << searching << \" exit=\" << exit << sync_endl;\n#endif",
              "        cv.wait(lk, [&] { return searching; });\n#if defined(__EMSCRIPTEN__)\n        std::fprintf(stderr, \"WASM_DIAG_STDERR wait_return idx=%zu searching=%d exit=%d\\n\", idx, int(searching), int(exit));\n        std::fflush(stderr);\n        sync_cout << \"WASM_DIAG idle_wait_return idx=\" << idx << \" searching=\" << searching << \" exit=\" << exit << sync_endl;\n#endif"
          )

          replace_once(
              "thread.cpp",
              "#if defined(__EMSCRIPTEN__)\n            sync_cout << \"WASM_DIAG idle_job_begin idx=\" << idx << sync_endl;\n#endif",
              "#if defined(__EMSCRIPTEN__)\n            std::fprintf(stderr, \"WASM_DIAG_STDERR idle_job_begin idx=%zu\\n\", idx);\n            std::fflush(stderr);\n            sync_cout << \"WASM_DIAG idle_job_begin idx=\" << idx << sync_endl;\n#endif"
          )

          replace_once(
              search_file,
              "#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG worker_start_searching\" << sync_endl;\n#endif",
              "#if defined(__EMSCRIPTEN__)\n    std::fprintf(stderr, \"WASM_DIAG_STDERR worker_start_searching\\n\");\n    std::fflush(stderr);\n    sync_cout << \"WASM_DIAG worker_start_searching\" << sync_endl;\n#endif"
          )
          replace_once(
              "thread.cpp",
              "    cv.notify_one();\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG notify_after idx=\" << idx << sync_endl;\n#endif",
              "    cv.notify_all();\n#if defined(__EMSCRIPTEN__)\n    std::fprintf(stderr, \"WASM_DIAG_STDERR notify_all idx=%zu\\n\", idx);\n    std::fflush(stderr);\n    sync_cout << \"WASM_DIAG notify_after idx=\" << idx << sync_endl;\n#endif"
          )
          print("WASM_SEARCH_DIAGNOSTICS_PATCHED")
                    replace_once(
              "thread.cpp",
              "        sync_cout << \"WASM_DIAG idle_wait_begin idx=\" << idx << sync_endl;",
              "        std::fprintf(stderr, \"WASM_DIAG_STDERR idle_wait_begin this=%p idx=%zu\\n\", static_cast<void*>(this), idx);\n        std::fflush(stderr);\n        sync_cout << \"WASM_DIAG idle_wait_begin idx=\" << idx << sync_endl;"
          )

          replace_once(
              "thread.cpp",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR wait_return idx=%zu searching=%d exit=%d\\n\", idx, int(searching), int(exit));",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR wait_return this=%p idx=%zu searching=%d exit=%d\\n\", static_cast<void*>(this), idx, int(searching), int(exit));"
          )

          replace_once(
              "thread.cpp",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR notify_all idx=%zu\\n\", idx);",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR notify_all this=%p idx=%zu\\n\", static_cast<void*>(this), idx);"
          )

          replace_once(
              "thread.cpp",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR idle_job_begin idx=%zu\\n\", idx);",
              "std::fprintf(stderr, \"WASM_DIAG_STDERR idle_job_begin this=%p idx=%zu\\n\", static_cast<void*>(this), idx);"
          )

          replace_once(
              "thread.cpp",
              "    sync_cout << \"WASM_DIAG start_searching_request idx=\" << idx << sync_endl;",
              "    std::fprintf(stderr, \"WASM_DIAG_STDERR start_searching_request this=%p idx=%zu\\n\", static_cast<void*>(this), idx);\n    std::fflush(stderr);\n    sync_cout << \"WASM_DIAG start_searching_request idx=\" << idx << sync_endl;"
          )
          PY
          
      - name: Build micro WASM engine
        working-directory: upstream/source
        shell: bash
        run: |
          set -euo pipefail

          emmake make -j2 normal \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_ka2_2048_8_64_progress8 \
            TARGET_CPU=WASM \
            COMPILER=em++ \
            PYTHON=python3 \
            EVAL_EMBEDDING=OFF

          test -f yaneuraou.js
          test -f yaneuraou.wasm

          cp yaneuraou.js "$GITHUB_WORKSPACE/output/"
          cp yaneuraou.wasm "$GITHUB_WORKSPACE/output/"

      - name: Show output files
        run: |
          find output -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -s output/yaneuraou.js
          test -s output/yaneuraou.wasm
          test -s output/evaldata/nn.bin

      - name: Upload WASM build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuyouraou-11micro-wasm
          path: output/
          if-no-files-found: error
          retention-days: 7
      - name: Smoke-test USI in Node.js
        working-directory: output
        shell: bash
        run: |
          set -euo pipefail
          cp yaneuraou.js yaneuraou.cjs

          cat > smoke-test.cjs <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const lines = [];
          const waiters = [];

          function recordLine(value) {
          const line = String(value).trim();
          if (!line) return;

          lines.push(line);

          for (let i = waiters.length - 1; i >= 0; i--) {
          if (waiters[i].test(line)) {
          const waiter = waiters.splice(i, 1)[0];
          clearTimeout(waiter.timer);
          waiter.resolve(line);
              }
            }
          }

          function waitFor(test, name, timeoutMs) {
          const existing = lines.find(test);
          if (existing) return Promise.resolve(existing);

          return new Promise((resolve, reject) => {
          const waiter = {
                test,
                resolve,
                timer: setTimeout(() => {
                  const i = waiters.indexOf(waiter);
                  if (i >= 0) waiters.splice(i, 1);
                  reject(new Error("TIMEOUT: " + name));
                }, timeoutMs)
              };

              waiters.push(waiter);
            });
          }

          // Emscripten の Node.js 標準出力を直接捕捉する。
          const originalWriteSync = fs.writeSync.bind(fs);
          let stdoutCaptureBuffer = "";

          fs.writeSync = function (fd, data, ...args) {
            const result = originalWriteSync(fd, data, ...args);

            if (fd === 1 && typeof data === "string") {
              stdoutCaptureBuffer += data;

              let newlineIndex;
              while (
                (newlineIndex = stdoutCaptureBuffer.indexOf("\n")) !== -1
              ) {
                const line = stdoutCaptureBuffer.slice(0, newlineIndex).trim();
                stdoutCaptureBuffer = stdoutCaptureBuffer.slice(newlineIndex + 1);

                if (line) {
                  recordLine(line);
                }
              }
            }

            return result;
          };

          const createEngine = require("./yaneuraou.cjs");

          async function main() {
            const engine = await createEngine({
              locateFile: file => path.join(__dirname, file)
            });

            if (
              !engine.FS ||
              !engine.postMessage ||
              !engine.addMessageListener
            ) {
              throw new Error("Required WASM runtime APIs are missing");
            }

            // 通常のメッセージ受信も併用する。
            // USI コマンドが WASM エンジンに届くかを記録する。
            const originalConsoleLog = console.log.bind(console);
            const originalCcall = engine.ccall.bind(engine);

            engine.ccall = function (
              identifier,
              returnType,
              argTypes,
              args
            ) {
              const isUsiCommand = identifier === "usi_command";
              const command = args && args[0];
              const startedAt = Date.now();

              if (isUsiCommand) {
                originalWriteSync(
                  1,
                  `[USI_CCALL_BEGIN] ${String(command)}\n`
                );
              }

              try {
                const result = originalCcall(
                  identifier,
                  returnType,
                  argTypes,
                  args
                );

                if (isUsiCommand) {
                  originalWriteSync(
                    1,
                    `[USI_CCALL_END] ${String(command)} => ${String(result)} (${Date.now() - startedAt}ms)\n`
                  );
                }

                return result;
              } catch (error) {
                if (isUsiCommand) {
                  originalWriteSync(
                    1,
                    `[USI_CCALL_THROW] ${String(command)} => ${String(error)}\n`
                  );
                }

                throw error;
              }
            };
            engine.addMessageListener(line => {
              const text = String(line).trim();
              originalConsoleLog("ENGINE:", text);
              recordLine(text);
            });

            console.log("POSTRUN_TYPE", typeof engine.postRun);

            if (typeof engine.postRun !== "function") {
              throw new Error("Expected postRun callback to be a function");
            }

            console.log("POSTRUN_RECOVERY: invoking function");
            engine.postRun();

            console.log(
              "POSTMESSAGE_AFTER",
              engine.postMessage.toString().slice(0, 200)
            );

            function ensureDir(dir) {
              const normalized = path.posix.resolve("/", dir);
              let current = "/";

              for (const part of normalized.split("/").filter(Boolean)) {
                current = path.posix.join(current, part);

                try {
                  engine.FS.stat(current);
                } catch {
                  engine.FS.mkdir(current);
                }
              }
            }

            const evalDirs = [
              "/evaldata",
              path.join(__dirname, "evaldata")
            ];

            for (const dir of evalDirs) {
              ensureDir(dir);
            }

            for (const file of [
              "nn.bin",
              "progress.bin",
              "eval_options.txt",
              "tag.json"
            ]) {
              const data = fs.readFileSync(
                path.join(__dirname, "evaldata", file)
              );

              for (const dir of evalDirs) {
                engine.FS.writeFile(
                  path.posix.join(dir, file),
                  data
                );
              }
            }

            const usiok = waitFor(
              line => line === "usiok",
              "usiok",
              60000
            );

            if (!lines.includes("usiok")) {
              engine.postMessage("usi");
            }

            await usiok;
            console.log("USI_HANDSHAKE_OK");

            engine.postMessage("setoption name USI_Hash value 64");
            engine.postMessage("setoption name Threads value 1");
            engine.postMessage("setoption name EvalDir value evaldata");
            engine.postMessage("setoption name FV_SCALE value 24");

            const readyok = waitFor(
              line => line === "readyok",
              "readyok",
              120000
            );

            engine.postMessage("isready");
            await readyok;
            console.log("USI_READY_OK");

            const evalLine = waitFor(
              line => /^eval\s*=/.test(line),
              "eval command",
              30000
            );

            engine.postMessage("e");

            const evalResult = await evalLine;
            console.log("USI_EVAL_OK:", evalResult);

            engine.postMessage("position startpos");

            const bestmove = waitFor(
              line => /^bestmove\s+\S+/.test(line),
              "bestmove after go nodes 1",
              30000
            );

            engine.postMessage("go nodes 1");

            const result = await bestmove;
            console.log("USI_SMOKE_TEST_OK:", result);

            engine.postMessage("quit");
            await new Promise(resolve => setTimeout(resolve, 100));
            process.exit(0);
          }

          main().catch(error => {
            console.error("USI_SMOKE_TEST_FAILED:", error);
            process.exit(1);
          });
          NODE

          timeout 240s node smoke-test.cjs
