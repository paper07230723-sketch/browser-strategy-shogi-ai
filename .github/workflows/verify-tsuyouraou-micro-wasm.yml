          python3 - <<'PY'
          from pathlib import Path

          path = Path("thread.cpp")
          source = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"ERROR: expected one match, got {count}: {old}"
                  )
              source = source.replace(old, new, 1)

          replace_once(
              "        cvFinished.notify_all();  // Wake completion waiters",
