                  std::fflush(stderr);
          #endif
              }
          #if defined(__EMSCRIPTEN__)
              sync_cout << "WASM_DIAG notify_before idx=" << idx << sync_endl;
          #endif
              cv.notify_one();
          #if defined(__EMSCRIPTEN__)
              std::fprintf(stderr, "WASM_DIAG_STDERR notify_one this=%p idx=%zu\n", static_cast<void*>(this), idx);
              std::fflush(stderr);
              sync_cout << "WASM_DIAG notify_after idx=" << idx << sync_endl;
          #endif
          }'''
          )
          
          replace_once(
              "thread.cpp",
              r'''void Thread::start_searching() {
              assert(worker != nullptr);
          #if defined(__EMSCRIPTEN__)
              std::fprintf(stderr, "WASM_DIAG_STDERR start_searching_request this=%p idx=%zu exit=%d\n", static_cast<void*>(this), idx, int(exit));
