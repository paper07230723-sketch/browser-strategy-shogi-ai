          #endif
          }''',
              r'''void Thread::start_searching() {
              assert(worker != nullptr);
          #if defined(__EMSCRIPTEN__)
              std::fprintf(stderr, "WASM_DIAG_STDERR start_searching_request this=%p idx=%zu exit=%d\n", static_cast<void*>(this), idx, int(exit));
              std::fflush(stderr);
              sync_cout << "WASM_DIAG start_searching_request idx=" << idx << sync_endl;
          #endif
              run_custom_job([this]() { worker->start_searching(); });
          #if defined(__EMSCRIPTEN__)
              if (idx == 0 && !exit) {
                  std::fprintf(stderr, "WASM_DIAG_STDERR main_search_probe_notify_all this=%p idx=%zu\n", static_cast<void*>(this), idx);
                  std::fflush(stderr);
                  cv.notify_all();
              }
              sync_cout << "WASM_DIAG start_searching_queued idx=" << idx << sync_endl;
          #endif
          }'''
          )
          replace_once(
