name: Verify TuyouraOu 11 micro WASM

on:
  push:
    branches:
      - automation/tsuyouraou-micro-wasm-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuyouraou-micro-wasm
  cancel-in-progress: true

jobs:
  build-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout pinned YaneuraOu source
        uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 32165a8ded29e5fd1bcbd2fa5dbf2eeb6725bd0f
          path: upstream

      - name: Install archive utility
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.23

      - name: Verify toolchain
        run: |
          emcc --version
          em++ --version
          node --version
          python3 --version

      - name: Download and verify micro evaluation
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/tuyouraou-micro.7z"
          extract_dir="$RUNNER_TEMP/micro-eval"

          curl --fail --location --retry 3 \
            "https://github.com/paper07230723-sketch/browser-strategy-shogi-ai/releases/download/eval-check-2026-10-22/TuyouraOu11micro-SFNN_ka2_2048_8_64_progress8-epoch0010-20261001.2.7z" \
            --output "$archive"

          echo "d1326e9a620c30d40ae553259dd0b6828d2f4e9fca3b6ab9440566579ab0e8c2  $archive" \
            | sha256sum --check -

          mkdir -p "$extract_dir"
          7z x "$archive" "-o$extract_dir" -y

          nn_path="$(find "$extract_dir" -type f -name nn.bin -print -quit)"
          test -n "$nn_path"

          eval_dir="$(dirname "$nn_path")"
          for file in nn.bin progress.bin eval_options.txt tag.json; do
            test -f "$eval_dir/$file"
          done

          mkdir -p "$GITHUB_WORKSPACE/output/evaldata"
          cp "$eval_dir"/nn.bin \
             "$eval_dir"/progress.bin \
             "$eval_dir"/eval_options.txt \
             "$eval_dir"/tag.json \
             "$GITHUB_WORKSPACE/output/evaldata/"
      - name: Keep upstream WASM thread code unchanged
        run: |
          echo "Using pinned upstream thread.cpp without local workaround"
          from pathlib import Path

          p = Path("thread.cpp")
          s = p.read_text(encoding="utf-8")
          marker = "// 生成したスレッドに対してThread::clear_worker()を呼び出す。"

          if s.count(marker) != 1:
              raise SystemExit("ERROR: 対象箇所を一意に特定できません")

          start = s.index(marker)
          end_marker = "main_thread()->wait_for_search_finished();"
          end = s.find(end_marker, start)

          if end < 0:
              raise SystemExit("ERROR: 待機処理が見つかりません")

          end += len(end_marker)
          old = s[start:end]

          if old.count("clear();") != 1:
              raise SystemExit("ERROR: clear() の位置が想定と異なります")

          replacement = """#if !defined(__EMSCRIPTEN__)
                  clear();
                  main_thread()->wait_for_search_finished();
          #endif"""

          p.write_text(s[:start] + replacement + s[end:], encoding="utf-8")
          print("WASM_STARTUP_WORKAROUND_APPLIED")
          PY
      - name: Build micro WASM engine
        working-directory: upstream/source
        shell: bash
        run: |
          set -euo pipefail

          emmake make -j2 normal \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_ka2_2048_8_64_progress8 \
            TARGET_CPU=WASM \
            COMPILER=em++ \
            PYTHON=python3 \
            EVAL_EMBEDDING=OFF

          test -f yaneuraou.js
          test -f yaneuraou.wasm

          cp yaneuraou.js "$GITHUB_WORKSPACE/output/"
          cp yaneuraou.wasm "$GITHUB_WORKSPACE/output/"

      - name: Show output files
        run: |
          find output -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -s output/yaneuraou.js
          test -s output/yaneuraou.wasm
          test -s output/evaldata/nn.bin

      - name: Upload WASM build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuyouraou-11micro-wasm
          path: output/
          if-no-files-found: error
          retention-days: 7
      - name: Smoke-test USI in Node.js
        working-directory: output
        shell: bash
        run: |
          set -euo pipefail
          cp yaneuraou.js yaneuraou.cjs

          cat > smoke-test.cjs <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const lines = [];
          const waiters = [];

          function recordLine(value) {
          const line = String(value).trim();
          if (!line) return;

          lines.push(line);

          for (let i = waiters.length - 1; i >= 0; i--) {
          if (waiters[i].test(line)) {
          const waiter = waiters.splice(i, 1)[0];
          clearTimeout(waiter.timer);
          waiter.resolve(line);
              }
            }
          }

          function waitFor(test, name, timeoutMs) {
          const existing = lines.find(test);
          if (existing) return Promise.resolve(existing);

          return new Promise((resolve, reject) => {
          const waiter = {
                test,
                resolve,
                timer: setTimeout(() => {
                  const i = waiters.indexOf(waiter);
                  if (i >= 0) waiters.splice(i, 1);
                  reject(new Error("TIMEOUT: " + name));
                }, timeoutMs)
              };

              waiters.push(waiter);
            });
          }

          // Emscripten の Node.js 標準出力を直接捕捉する。
          const originalWriteSync = fs.writeSync.bind(fs);
          let stdoutCaptureBuffer = "";

          fs.writeSync = function (fd, data, ...args) {
            const result = originalWriteSync(fd, data, ...args);

            if (fd === 1 && typeof data === "string") {
              stdoutCaptureBuffer += data;

              let newlineIndex;
              while (
                (newlineIndex = stdoutCaptureBuffer.indexOf("\n")) !== -1
              ) {
                const line = stdoutCaptureBuffer.slice(0, newlineIndex).trim();
                stdoutCaptureBuffer = stdoutCaptureBuffer.slice(newlineIndex + 1);

                if (line) {
                  recordLine(line);
                }
              }
            }

            return result;
          };

          const createEngine = require("./yaneuraou.cjs");

          async function main() {
            const engine = await createEngine({
              locateFile: file => path.join(__dirname, file)
            });

            if (
              !engine.FS ||
              !engine.postMessage ||
              !engine.addMessageListener
            ) {
              throw new Error("Required WASM runtime APIs are missing");
            }

            // 通常のメッセージ受信も併用する。
            // USI コマンドが WASM エンジンに届くかを記録する。
            const originalConsoleLog = console.log.bind(console);
            const originalCcall = engine.ccall.bind(engine);

            engine.ccall = function (
              identifier,
              returnType,
              argTypes,
              args
            ) {
              const isUsiCommand = identifier === "usi_command";
              const command = args && args[0];
              const startedAt = Date.now();

              if (isUsiCommand) {
                originalWriteSync(
                  1,
                  `[USI_CCALL_BEGIN] ${String(command)}\n`
                );
              }

              try {
                const result = originalCcall(
                  identifier,
                  returnType,
                  argTypes,
                  args
                );

                if (isUsiCommand) {
                  originalWriteSync(
                    1,
                    `[USI_CCALL_END] ${String(command)} => ${String(result)} (${Date.now() - startedAt}ms)\n`
                  );
                }

                return result;
              } catch (error) {
                if (isUsiCommand) {
                  originalWriteSync(
                    1,
                    `[USI_CCALL_THROW] ${String(command)} => ${String(error)}\n`
                  );
                }

                throw error;
              }
            };
            engine.addMessageListener(line => {
              const text = String(line).trim();
              originalConsoleLog("ENGINE:", text);
              recordLine(text);
            });

            console.log("POSTRUN_TYPE", typeof engine.postRun);

            if (typeof engine.postRun !== "function") {
              throw new Error("Expected postRun callback to be a function");
            }

            console.log("POSTRUN_RECOVERY: invoking function");
            engine.postRun();

            console.log(
              "POSTMESSAGE_AFTER",
              engine.postMessage.toString().slice(0, 200)
            );

            function ensureDir(dir) {
              const normalized = path.posix.resolve("/", dir);
              let current = "/";

              for (const part of normalized.split("/").filter(Boolean)) {
                current = path.posix.join(current, part);

                try {
                  engine.FS.stat(current);
                } catch {
                  engine.FS.mkdir(current);
                }
              }
            }

            const evalDirs = [
              "/evaldata",
              path.join(__dirname, "evaldata")
            ];

            for (const dir of evalDirs) {
              ensureDir(dir);
            }

            for (const file of [
              "nn.bin",
              "progress.bin",
              "eval_options.txt",
              "tag.json"
            ]) {
              const data = fs.readFileSync(
                path.join(__dirname, "evaldata", file)
              );

              for (const dir of evalDirs) {
                engine.FS.writeFile(
                  path.posix.join(dir, file),
                  data
                );
              }
            }

            const usiok = waitFor(
              line => line === "usiok",
              "usiok",
              60000
            );

            if (!lines.includes("usiok")) {
              engine.postMessage("usi");
            }

            await usiok;
            console.log("USI_HANDSHAKE_OK");

            engine.postMessage("setoption name USI_Hash value 64");
            engine.postMessage("setoption name Threads value 1");
            engine.postMessage("setoption name EvalDir value evaldata");
            engine.postMessage("setoption name FV_SCALE value 24");

            const readyok = waitFor(
              line => line === "readyok",
              "readyok",
              120000
            );

            engine.postMessage("isready");
            await readyok;
            console.log("USI_READY_OK");

            const bestmove = waitFor(
              line => /^bestmove\s+\S+/.test(line),
              "bestmove",
              30000
            );

            engine.postMessage("position startpos");
            engine.postMessage("go depth 1");

            const stopWatchdog = setTimeout(() => {
              originalWriteSync(
                1,
                "[WATCHDOG] sending stop after 10 seconds\n"
              );
              engine.postMessage("stop");
            }, 10000);

            const result = await bestmove;
            clearTimeout(stopWatchdog);
            console.log("USI_SMOKE_TEST_OK:", result);

            engine.postMessage("quit");
            await new Promise(resolve => setTimeout(resolve, 100));
            process.exit(0);
          }

          main().catch(error => {
            console.error("USI_SMOKE_TEST_FAILED:", error);
            process.exit(1);
          });
          NODE

          timeout 240s node smoke-test.cjs
