                      diagPollCount % 10 == 0) {
                      std::fprintf(
                          stderr,
                          "WASM_DIAG idle_poll_return this=%p idx=%zu count=%u status=%d searching=%d exit=%d queued_job=%d\\n",
                          static_cast<void*>(this), idx, diagPollCount,
