name: Verify TuyouraOu 11 micro WASM

on:
  push:
    branches:
      - automation/tsuyouraou-micro-wasm-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuyouraou-micro-wasm
  cancel-in-progress: true

jobs:      
  build-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout pinned YaneuraOu source
        uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 32165a8ded29e5fd1bcbd2fa5dbf2eeb6725bd0f
          path: upstream

      - name: Install archive utility
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.13

      - name: Verify toolchain
        run: |
          emcc --version
          em++ --version
          node --version
          python3 --version
      - name: Diagnostic - condition_variable wake test
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/cv-smoke.cpp" <<'CPP'
          #include <condition_variable>
          #include <cstdio>
          #include <mutex>
          #include <thread>

          int main() {
              std::mutex mutex;
              std::condition_variable cv;
              std::condition_variable enteredCv;
              bool entered = false;
              bool ready = false;

              std::thread worker([&]() {
                  std::unique_lock<std::mutex> lock(mutex);
                  entered = true;
                  enteredCv.notify_one();

                  std::fprintf(stderr, "CV_TEST_WORKER_WAITING\n");
                  std::fflush(stderr);

                  cv.wait(lock, [&]() { return ready; });

                  std::fprintf(stderr, "CV_TEST_WORKER_WOKE\n");
                  std::fflush(stderr);
              });

              {
                  std::unique_lock<std::mutex> lock(mutex);
                  enteredCv.wait(lock, [&]() { return entered; });
                  ready = true;
              }

              cv.notify_one();
              worker.join();

              std::fprintf(stderr, "CV_TEST_OK\n");
              return 0;
          }
          CPP

          em++ "$RUNNER_TEMP/cv-smoke.cpp" \
            -O2 \
            -pthread \
            -sPTHREAD_POOL_SIZE=1 \
            -sPTHREAD_POOL_SIZE_STRICT=1 \
            -sEXIT_RUNTIME=1 \
            -o "$RUNNER_TEMP/cv-smoke.js"

          echo "CV_TEST_BUILD_OK"
          timeout 20s node "$RUNNER_TEMP/cv-smoke.js"
      - name: Diagnostic - condition_variable thread reuse stress
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/cv-reuse-stress.cpp" <<'CPP'
          #include <condition_variable>
          #include <cstdio>
          #include <mutex>
          #include <thread>

          int main() {
              for (int i = 0; i < 64; ++i) {
                  std::mutex mutex;
                  std::condition_variable cv;
                  std::condition_variable enteredCv;
                  bool entered = false;
                  bool ready = false;

                  std::thread worker([&]() {
                      std::unique_lock<std::mutex> lock(mutex);
                      entered = true;
                      enteredCv.notify_one();
                      cv.wait(lock, [&]() { return ready; });
                  });

                  {
                      std::unique_lock<std::mutex> lock(mutex);
                      enteredCv.wait(lock, [&]() { return entered; });
                      ready = true;
                  }

                  cv.notify_one();
                  worker.join();

                  if ((i + 1) % 8 == 0) {
                      std::fprintf(stderr, "CV_REUSE_PROGRESS %d\n", i + 1);
                      std::fflush(stderr);
                  }
              }

              std::fprintf(stderr, "CV_REUSE_STRESS_OK\n");
              return 0;
          }
          CPP

          em++ "$RUNNER_TEMP/cv-reuse-stress.cpp" \
            -O2 \
            -pthread \
            -sPTHREAD_POOL_SIZE=1 \
            -sPTHREAD_POOL_SIZE_STRICT=1 \
            -sEXIT_RUNTIME=1 \
            -o "$RUNNER_TEMP/cv-reuse-stress.js"

          echo "CV_REUSE_BUILD_OK"
          timeout 30s node "$RUNNER_TEMP/cv-reuse-stress.js"
      - name: Diagnostic - persistent job queue
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/cv-job-queue.cpp" <<'CPP'
          #include <condition_variable>
          #include <cstdio>
          #include <mutex>
          #include <thread>

          int main() {
              std::mutex mutex;
              std::condition_variable cv;
              std::condition_variable readyCv;
              bool workerReady = false;
              bool searching = false;
              bool exitWorker = false;
              int queuedJob = 0;
              int completedJob = 0;

              std::thread worker([&]() {
                  while (true) {
                      std::unique_lock<std::mutex> lock(mutex);
                      searching = false;

                      if (!workerReady) {
                          workerReady = true;
                          readyCv.notify_one();
                      }

                      cv.notify_one();
                      cv.wait(lock, [&]() { return searching; });

                      if (exitWorker)
                          return;

                      const int job = queuedJob;
                      lock.unlock();

                      {
                          std::lock_guard<std::mutex> doneLock(mutex);
                          completedJob = job;
                      }
                  }
              });

              {
                  std::unique_lock<std::mutex> lock(mutex);
                  readyCv.wait(lock, [&]() { return workerReady; });
              }

              for (int i = 1; i <= 128; ++i) {
                  {
                      std::unique_lock<std::mutex> lock(mutex);
                      cv.wait(lock, [&]() { return !searching; });
                      queuedJob = i;
                      searching = true;
                  }

                  cv.notify_one();

                  {
                      std::unique_lock<std::mutex> lock(mutex);
                      cv.wait(lock, [&]() {
                          return !searching && completedJob >= i;
                      });
                  }

                  if (i % 16 == 0) {
                      std::fprintf(stderr, "CV_QUEUE_PROGRESS %d\n", i);
                      std::fflush(stderr);
                  }
              }

              {
                  std::unique_lock<std::mutex> lock(mutex);
                  cv.wait(lock, [&]() {
                      return !searching && completedJob == 128;
                  });
                  exitWorker = true;
                  searching = true;
              }

              cv.notify_one();
              worker.join();

              std::fprintf(stderr, "CV_QUEUE_STRESS_OK\n");
              return 0;
          }
          CPP

          em++ "$RUNNER_TEMP/cv-job-queue.cpp" \
            -O2 \
            -pthread \
            -sPTHREAD_POOL_SIZE=1 \
            -sPTHREAD_POOL_SIZE_STRICT=1 \
            -sEXIT_RUNTIME=1 \
            -o "$RUNNER_TEMP/cv-job-queue.js"

          echo "CV_QUEUE_BUILD_OK"
          timeout 30s node "$RUNNER_TEMP/cv-job-queue.js"
      - name: Download and verify micro evaluation
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/tuyouraou-micro.7z"
          extract_dir="$RUNNER_TEMP/micro-eval"

          curl --fail --location --retry 3 \
            "https://github.com/paper07230723-sketch/browser-strategy-shogi-ai/releases/download/eval-check-2026-10-22/TuyouraOu11micro-SFNN_ka2_2048_8_64_progress8-epoch0010-20261001.2.7z" \
            --output "$archive"

          echo "d1326e9a620c30d40ae553259dd0b6828d2f4e9fca3b6ab9440566579ab0e8c2  $archive" \
            | sha256sum --check -

          mkdir -p "$extract_dir"
          7z x "$archive" "-o$extract_dir" -y

          nn_path="$(find "$extract_dir" -type f -name nn.bin -print -quit)"
          test -n "$nn_path"

          eval_dir="$(dirname "$nn_path")"
          for file in nn.bin progress.bin eval_options.txt tag.json; do
            test -f "$eval_dir/$file"
          done

          mkdir -p "$GITHUB_WORKSPACE/output/evaldata"
          cp "$eval_dir"/nn.bin \
             "$eval_dir"/progress.bin \
             "$eval_dir"/eval_options.txt \
             "$eval_dir"/tag.json \
             "$GITHUB_WORKSPACE/output/evaldata/"
             
      - name: Add temporary WASM search diagnostics
        working-directory: upstream/source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(filename, old, new):
              path = Path(filename)
              source = path.read_text(encoding="utf-8-sig")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"ERROR: {filename}: expected 1 match, got {count}"
                  )
              path.write_text(
                  source.replace(old, new, 1),
                  encoding="utf-8"
              )

          replace_once(
              "thread.cpp",
              "Search::LimitsType limits) {\n\n    main_thread()->wait_for_search_finished();",
              "Search::LimitsType limits) {\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG start_thinking_enter\" << sync_endl;\n#endif\n\n    main_thread()->wait_for_search_finished();"
          )

          replace_once(
              "thread.cpp",
              "    for (auto&& th : threads)\n        th->wait_for_search_finished();\n\n    main_thread()->start_searching();",
              "    for (auto&& th : threads)\n        th->wait_for_search_finished();\n\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG setup_jobs_finished\" << sync_endl;\n    sync_cout << \"WASM_DIAG scheduling_main_search\" << sync_endl;\n#endif\n    main_thread()->start_searching();\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG main_search_scheduled\" << sync_endl;\n#endif"
          )

          replace_once(
              "thread.cpp",
              "        if (job)\n            job();",
              "        if (job) {\n#if defined(__EMSCRIPTEN__)\n            sync_cout << \"WASM_DIAG idle_job_begin idx=\" << idx << sync_endl;\n#endif\n            job();\n#if defined(__EMSCRIPTEN__)\n            sync_cout << \"WASM_DIAG idle_job_end idx=\" << idx << sync_endl;\n#endif\n        }"
          )

          search_file = "engine/yaneuraou-engine/yaneuraou-search.cpp"

          replace_once(
              search_file,
              "void Search::YaneuraOuWorker::start_searching() {\n\n#if defined(USE_SFNN)",
              "void Search::YaneuraOuWorker::start_searching() {\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG worker_start_searching\" << sync_endl;\n#endif\n\n#if defined(USE_SFNN)"
          )

          replace_once(
              search_file,
              "    uciPvSent = iterative_deepening();  // main thread start searching",
              "#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG iterative_deepening_enter\" << sync_endl;\n#endif\n    uciPvSent = iterative_deepening();  // main thread start searching\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG iterative_deepening_return\" << sync_endl;\n#endif"
          )
          replace_once(
              "thread.cpp",
              "void Thread::start_searching() {\n    assert(worker != nullptr);\n    run_custom_job([this]() { worker->start_searching(); });\n}",
              "void Thread::start_searching() {\n    assert(worker != nullptr);\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG start_searching_request idx=\" << idx << sync_endl;\n#endif\n    run_custom_job([this]() { worker->start_searching(); });\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG start_searching_queued idx=\" << idx << sync_endl;\n#endif\n}"
          )

          replace_once(
              "thread.cpp",
              "        cv.wait(lk, [&] { return searching; });\n\n        if (exit)\n            return;",
              "#if defined(__EMSCRIPTEN__)\n        sync_cout << \"WASM_DIAG idle_wait_begin idx=\" << idx << sync_endl;\n#endif\n        cv.wait(lk, [&] { return searching; });\n#if defined(__EMSCRIPTEN__)\n        sync_cout << \"WASM_DIAG idle_wait_return idx=\" << idx << \" searching=\" << searching << \" exit=\" << exit << sync_endl;\n#endif\n\n        if (exit)\n            return;"
          )
          replace_once(
              "thread.cpp",
              "void Thread::run_custom_job(std::function<void()> f) {\n    {\n        std::unique_lock<std::mutex> lk(mutex);\n        cv.wait(lk, [&] { return !searching; });\n        jobFunc   = std::move(f);\n        searching = true;\n    }\n    cv.notify_one();\n}",
              "void Thread::run_custom_job(std::function<void()> f) {\n    {\n        std::unique_lock<std::mutex> lk(mutex);\n        cv.wait(lk, [&] { return !searching; });\n        jobFunc   = std::move(f);\n        searching = true;\n    }\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG notify_before idx=\" << idx << sync_endl;\n#endif\n    cv.notify_one();\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG notify_after idx=\" << idx << sync_endl;\n#endif\n}"
          )
          replace_once(
              "thread.cpp",
              "#include <cmath>     // std::abs",
              "#include <cmath>     // std::abs\n#include <cstdio>"
          )

          replace_once(
              search_file,
              "#include <sstream>",
              "#include <cstdio>\n#include <sstream>"
          )

          replace_once(
              "thread.cpp",
              "        cv.wait(lk, [&] { return searching; });\n#if defined(__EMSCRIPTEN__)\n        sync_cout << \"WASM_DIAG idle_wait_return idx=\" << idx << \" searching=\" << searching << \" exit=\" << exit << sync_endl;\n#endif",
              "        cv.wait(lk, [&] { return searching; });\n#if defined(__EMSCRIPTEN__)\n        std::fprintf(stderr, \"WASM_DIAG_STDERR wait_return idx=%zu searching=%d exit=%d\\n\", idx, int(searching), int(exit));\n        std::fflush(stderr);\n        sync_cout << \"WASM_DIAG idle_wait_return idx=\" << idx << \" searching=\" << searching << \" exit=\" << exit << sync_endl;\n#endif"
          )

          replace_once(
              "thread.cpp",
              "#if defined(__EMSCRIPTEN__)\n            sync_cout << \"WASM_DIAG idle_job_begin idx=\" << idx << sync_endl;\n#endif",
              "#if defined(__EMSCRIPTEN__)\n            std::fprintf(stderr, \"WASM_DIAG_STDERR idle_job_begin idx=%zu\\n\", idx);\n            std::fflush(stderr);\n            sync_cout << \"WASM_DIAG idle_job_begin idx=\" << idx << sync_endl;\n#endif"
          )

          replace_once(
              search_file,
              "#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG worker_start_searching\" << sync_endl;\n#endif",
              "#if defined(__EMSCRIPTEN__)\n    std::fprintf(stderr, \"WASM_DIAG_STDERR worker_start_searching\\n\");\n    std::fflush(stderr);\n    sync_cout << \"WASM_DIAG worker_start_searching\" << sync_endl;\n#endif"
          )
          replace_once(
              "thread.cpp",
              "    cv.notify_one();\n#if defined(__EMSCRIPTEN__)\n    sync_cout << \"WASM_DIAG notify_after idx=\" << idx << sync_endl;\n#endif",
              "    cv.notify_one();\n#if defined(__EMSCRIPTEN__)\n    std::fprintf(stderr, \"WASM_DIAG_STDERR notify_one idx=%zu\\n\", idx);\n    std::fflush(stderr);\n    sync_cout << \"WASM_DIAG notify_after idx=\" << idx << sync_endl;\n#endif"
          )
          
          print("WASM_SEARCH_DIAGNOSTICS_PATCHED")
          replace_once(
