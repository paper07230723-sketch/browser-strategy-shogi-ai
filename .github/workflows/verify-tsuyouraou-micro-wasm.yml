      - name: Smoke-test USI in Node.js
        working-directory: output
        shell: bash
        run: |
          set -euo pipefail
          cp yaneuraou.js yaneuraou.cjs

          cat > smoke-test.cjs <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const lines = [];
          const waiters = [];

          function recordLine(value) {
          const line = String(value).trim();
          if (!line) return;

          lines.push(line);

          for (let i = waiters.length - 1; i >= 0; i--) {
          if (waiters[i].test(line)) {
          const waiter = waiters.splice(i, 1)[0];
          clearTimeout(waiter.timer);
          waiter.resolve(line);
              }
            }
          }

          function waitFor(test, name, timeoutMs) {
          const existing = lines.find(test);
          if (existing) return Promise.resolve(existing);

          return new Promise((resolve, reject) => {
          const waiter = {
                test,
                resolve,
                timer: setTimeout(() => {
                  const i = waiters.indexOf(waiter);
                  if (i >= 0) waiters.splice(i, 1);
                  reject(new Error("TIMEOUT: " + name));
                }, timeoutMs)
              };

              waiters.push(waiter);
            });
          }

          // Emscripten の Node.js 標準出力を直接捕捉する。
          const originalWriteSync = fs.writeSync.bind(fs);
          let stdoutCaptureBuffer = "";

          fs.writeSync = function (fd, data, ...args) {
            const result = originalWriteSync(fd, data, ...args);

            if (fd === 1 && typeof data === "string") {
              stdoutCaptureBuffer += data;

              let newlineIndex;
              while (
                (newlineIndex = stdoutCaptureBuffer.indexOf("\n")) !== -1
              ) {
                const line = stdoutCaptureBuffer.slice(0, newlineIndex).trim();
                stdoutCaptureBuffer = stdoutCaptureBuffer.slice(newlineIndex + 1);

                if (line) {
                  recordLine(line);
                }
              }
            }

            return result;
          };

          const createEngine = require("./yaneuraou.cjs");

          async function main() {
            const engine = await createEngine({
              locateFile: file => path.join(__dirname, file)
            });

            if (
              !engine.FS ||
              !engine.postMessage ||
              !engine.addMessageListener
            ) {
              throw new Error("Required WASM runtime APIs are missing");
            }

            // 通常のメッセージ受信も併用する。
            // USI コマンドが WASM エンジンに届くかを記録する。
            const originalConsoleLog = console.log.bind(console);
            const originalCcall = engine.ccall.bind(engine);

            engine.ccall = function (
              identifier,
              returnType,
              argTypes,
              args
            ) {
              const isUsiCommand = identifier === "usi_command";
              const command = args && args[0];
              const startedAt = Date.now();

              if (isUsiCommand) {
                originalWriteSync(
                  1,
                  `[USI_CCALL_BEGIN] ${String(command)}\n`
                );
              }

              try {
                const result = originalCcall(
                  identifier,
                  returnType,
                  argTypes,
                  args
                );

                if (isUsiCommand) {
                  originalWriteSync(
                    1,
                    `[USI_CCALL_END] ${String(command)} => ${String(result)} (${Date.now() - startedAt}ms)\n`
                  );
                }

                return result;
              } catch (error) {
                if (isUsiCommand) {
                  originalWriteSync(
                    1,
                    `[USI_CCALL_THROW] ${String(command)} => ${String(error)}\n`
                  );
                }

                throw error;
              }
            };
            engine.addMessageListener(line => {
              const text = String(line).trim();
              originalConsoleLog("ENGINE:", text);
              recordLine(text);
            });

            console.log("POSTRUN_TYPE", typeof engine.postRun);

            if (typeof engine.postRun !== "function") {
              throw new Error("Expected postRun callback to be a function");
            }

            console.log("POSTRUN_RECOVERY: invoking function");
            engine.postRun();

            console.log(
              "POSTMESSAGE_AFTER",
              engine.postMessage.toString().slice(0, 200)
            );

            function ensureDir(dir) {
              const normalized = path.posix.resolve("/", dir);
              let current = "/";

              for (const part of normalized.split("/").filter(Boolean)) {
                current = path.posix.join(current, part);

                try {
                  engine.FS.stat(current);
                } catch {
                  engine.FS.mkdir(current);
                }
              }
            }

            const evalDirs = [
              "/evaldata",
              path.join(__dirname, "evaldata")
            ];

            for (const dir of evalDirs) {
              ensureDir(dir);
            }

            for (const file of [
              "nn.bin",
              "progress.bin",
              "eval_options.txt",
              "tag.json"
            ]) {
              const data = fs.readFileSync(
                path.join(__dirname, "evaldata", file)
              );

              for (const dir of evalDirs) {
                engine.FS.writeFile(
                  path.posix.join(dir, file),
                  data
                );
              }
            }

            const usiok = waitFor(
              line => line === "usiok",
              "usiok",
              60000
            );

            if (!lines.includes("usiok")) {
              engine.postMessage("usi");
            }

            await usiok;
            console.log("USI_HANDSHAKE_OK");

            engine.postMessage("setoption name USI_Hash value 64");
            engine.postMessage("setoption name Threads value 1");
            engine.postMessage("setoption name EvalDir value evaldata");
            engine.postMessage("setoption name FV_SCALE value 24");
            engine.postMessage("setoption name MinimumThinkingTime value 1");
            engine.postMessage("setoption name RoundUpToFullSecond value false");
            const readyok = waitFor(
              line => line === "readyok",
              "readyok",
              120000
            );

            engine.postMessage("isready");
            await readyok;
            console.log("USI_READY_OK");

            const evalLine = waitFor(
              line => /^eval\s*=/.test(line),
              "eval command",
              30000
            );

            engine.postMessage("e");

            const evalResult = await evalLine;
            console.log("USI_EVAL_OK:", evalResult);

            engine.postMessage("position startpos");

            const bestmove = waitFor(
              line => /^bestmove\s+\S+/.test(line),
              "bestmove after go movetime 1000",
              30000
            );

            engine.postMessage("go movetime 1000");

            const result = await bestmove;
            console.log("USI_SMOKE_TEST_OK:", result);

            engine.postMessage("quit");
            await new Promise(resolve => setTimeout(resolve, 100));
            process.exit(0);
          }

          main().catch(error => {
            console.error("USI_SMOKE_TEST_FAILED:", error);
            process.exit(1);
          });
          NODE

          timeout 240s node smoke-test.cjs
