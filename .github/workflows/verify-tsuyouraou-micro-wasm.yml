name: Verify TuyouraOu 11 micro WASM

on:
  push:
    branches:
      - automation/tsuyouraou-micro-wasm-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuyouraou-micro-wasm
  cancel-in-progress: true

jobs:
  build-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout pinned YaneuraOu source
        uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 32165a8ded29e5fd1bcbd2fa5dbf2eeb6725bd0f
          path: upstream

      - name: Install archive utility
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.23

      - name: Verify toolchain
        run: |
          emcc --version
          em++ --version
          node --version
          python3 --version

      - name: Download and verify micro evaluation
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/tuyouraou-micro.7z"
          extract_dir="$RUNNER_TEMP/micro-eval"

          curl --fail --location --retry 3 \
            "https://github.com/paper07230723-sketch/browser-strategy-shogi-ai/releases/download/eval-check-2026-10-22/TuyouraOu11micro-SFNN_ka2_2048_8_64_progress8-epoch0010-20261001.2.7z" \
            --output "$archive"

          echo "d1326e9a620c30d40ae553259dd0b6828d2f4e9fca3b6ab9440566579ab0e8c2  $archive" \
            | sha256sum --check -

          mkdir -p "$extract_dir"
          7z x "$archive" "-o$extract_dir" -y

          nn_path="$(find "$extract_dir" -type f -name nn.bin -print -quit)"
          test -n "$nn_path"

          eval_dir="$(dirname "$nn_path")"
          for file in nn.bin progress.bin eval_options.txt tag.json; do
            test -f "$eval_dir/$file"
          done

          mkdir -p "$GITHUB_WORKSPACE/output/evaldata"
          cp "$eval_dir"/nn.bin \
             "$eval_dir"/progress.bin \
             "$eval_dir"/eval_options.txt \
             "$eval_dir"/tag.json \
             "$GITHUB_WORKSPACE/output/evaldata/"
      - name: Apply provisional WASM startup workaround
        working-directory: upstream/source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("thread.cpp")
          s = p.read_text(encoding="utf-8")
          marker = "// 生成したスレッドに対してThread::clear_worker()を呼び出す。"

          if s.count(marker) != 1:
              raise SystemExit("ERROR: 対象箇所を一意に特定できません")

          start = s.index(marker)
          end_marker = "main_thread()->wait_for_search_finished();"
          end = s.find(end_marker, start)

          if end < 0:
              raise SystemExit("ERROR: 待機処理が見つかりません")

          end += len(end_marker)
          old = s[start:end]

          if old.count("clear();") != 1:
              raise SystemExit("ERROR: clear() の位置が想定と異なります")

          replacement = """#if !defined(__EMSCRIPTEN__)
                  clear();
                  main_thread()->wait_for_search_finished();
          #endif"""

          p.write_text(s[:start] + replacement + s[end:], encoding="utf-8")
          print("WASM_STARTUP_WORKAROUND_APPLIED")
          PY
      - name: Build micro WASM engine
        working-directory: upstream/source
        shell: bash
        run: |
          set -euo pipefail

          emmake make -j2 normal \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_ka2_2048_8_64_progress8 \
            TARGET_CPU=WASM \
            COMPILER=em++ \
            PYTHON=python3 \
            EVAL_EMBEDDING=OFF

          test -f yaneuraou.js
          test -f yaneuraou.wasm

          cp yaneuraou.js "$GITHUB_WORKSPACE/output/"
          cp yaneuraou.wasm "$GITHUB_WORKSPACE/output/"

      - name: Show output files
        run: |
          find output -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -s output/yaneuraou.js
          test -s output/yaneuraou.wasm
          test -s output/evaldata/nn.bin

      - name: Upload WASM build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuyouraou-11micro-wasm
          path: output/
          if-no-files-found: error
          retention-days: 7
      - name: Smoke-test USI in Node.js
        working-directory: output
        shell: bash
        run: |
          set -euo pipefail
          cp yaneuraou.js yaneuraou.cjs

          cat > smoke-test.cjs <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const createEngine = require("./yaneuraou.cjs");

          async function main() {
            const engine = await createEngine({
              locateFile: file => path.join(__dirname, file)
            });
                        const lines = [];
            const waiters = [];

            engine.addMessageListener(line => {
              line = String(line).trim();
              console.log("ENGINE:", line);
              lines.push(line);

              for (let i = waiters.length - 1; i >= 0; i--) {
                if (waiters[i].test(line)) {
                  const waiter = waiters.splice(i, 1)[0];
                  clearTimeout(waiter.timer);
                  waiter.resolve(line);
                }
              }
            });

            // Emscripten 4.x postRun callback check.
            let recoveredPostRun = false;

            console.log("POSTRUN_TYPE", typeof engine.postRun);
            console.log(
              "POSTMESSAGE_BEFORE",
              engine.postMessage.toString().slice(0, 200)
            );

            if (typeof engine.postRun === "function") {
              console.log("POSTRUN_RECOVERY: invoking function");
              engine.postRun();
              recoveredPostRun = true;
            } else if (
              Array.isArray(engine.postRun) &&
              engine.postRun.length > 0
            ) {
              console.log(
                "POSTRUN_RECOVERY: pending callbacks",
                engine.postRun.length
              );

              while (engine.postRun.length > 0) {
                const callback = engine.postRun.shift();
                callback();
              }

              recoveredPostRun = true;
            } else {
              console.log("POSTRUN_RECOVERY: no callable callback");
            }

            console.log("POSTRUN_RECOVERY_RESULT", recoveredPostRun);
            console.log(
              "POSTMESSAGE_AFTER",
              engine.postMessage.toString().slice(0, 200)
            );

            function waitFor(test, name, timeoutMs) {
              const existing = lines.find(test);
              if (existing) return Promise.resolve(existing);

              return new Promise((resolve, reject) => {
                const waiter = {
                  test,
                  resolve,
                  timer: setTimeout(() => {
                    const i = waiters.indexOf(waiter);
                    if (i >= 0) waiters.splice(i, 1);
                    reject(new Error("TIMEOUT: " + name));
                  }, timeoutMs)
                };
                waiters.push(waiter);
              });
            }

            if (!engine.FS || !engine.postMessage ||
                !engine.addMessageListener) {
              throw new Error("Required WASM runtime APIs are missing");
            }

            engine.FS.mkdir("/evaldata");

            for (const file of [
              "nn.bin", "progress.bin", "eval_options.txt", "tag.json"
            ]) {
              engine.FS.writeFile(
                "/evaldata/" + file,
                fs.readFileSync(path.join(__dirname, "evaldata", file))
              );
            }

              const usiok = waitFor(
              line => line === "usiok", "usiok", 60000
            );

            if (!lines.includes("usiok")) {
              engine.postMessage("usi");
            }

            await usiok;

            engine.postMessage("setoption name USI_Hash value 64");
            engine.postMessage("setoption name EvalDir value evaldata");
            engine.postMessage("setoption name FV_SCALE value 24");

            const readyok = waitFor(
              line => line === "readyok", "readyok", 120000
            );
            engine.postMessage("isready");
            await readyok;

            const bestmove = waitFor(
              line => /^bestmove\s+\S+/.test(line),
              "bestmove", 90000
            );

            engine.postMessage("position startpos");
            engine.postMessage("go depth 1");

            const result = await bestmove;
            console.log("USI_SMOKE_TEST_OK:", result);

            engine.postMessage("quit");
            await new Promise(resolve => setTimeout(resolve, 100));
            process.exit(0);
          }

          main().catch(error => {
            console.error("USI_SMOKE_TEST_FAILED:", error);
            process.exit(1);
          });
          NODE

          timeout 240s node smoke-test.cjs
