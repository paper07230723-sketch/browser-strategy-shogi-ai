
name: Verify Feature Build

on:
  push:
    branches:
      - feature/kifu-analysis

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify pages
        run: |
          test -f dist/index.html
          test -f dist/game.html
